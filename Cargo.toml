[workspace]
resolver = "2"
members = [
    "crates/terminal-core",
    "crates/terminal-renderer",
    "crates/terminal-gtd",
    "crates/terminal-ai",
    "crates/terminal-app",
    "crates/terminal-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CySpiegel/terminal"

[workspace.dependencies]
terminal-core = { path = "crates/terminal-core" }
terminal-renderer = { path = "crates/terminal-renderer" }
terminal-gtd = { path = "crates/terminal-gtd" }
terminal-app = { path = "crates/terminal-app" }
terminal-ai = { path = "crates/terminal-ai" }
terminal-platform = { path = "crates/terminal-platform" }

# Shared dependencies
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
