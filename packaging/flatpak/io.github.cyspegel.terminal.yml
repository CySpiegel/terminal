app-id: io.github.cyspegel.terminal
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: terminal

finish-args:
  - --device=dri            # GPU access for wgpu
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio     # Terminal bell
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: terminal
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/terminal/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/terminal /app/bin/terminal
    sources:
      - type: git
        url: https://github.com/CySpiegel/terminal.git
        tag: v0.1.0
